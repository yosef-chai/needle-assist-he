name: validate

on:
  push:
  pull_request:
  schedule:
    # Home Assistant and HACS both tighten their rules over time; a monthly run
    # catches a break before a user does.
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # HACS looks this domain up in the home-assistant/brands repository,
          # which is a pull request against that repository and cannot be made
          # from here. The images themselves ship in
          # custom_components/needle_assist/brand/, which is where Home
          # Assistant serves a custom integration's icon from.
          ignore: brands

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned: an unpinned linter turns a new release into a red build on a
      # repository nobody has touched.
      - run: pip install ruff==0.16.3
      - run: ruff check .

  fast:
    name: Hebrew logic, with nothing installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No Home Assistant. Half of this integration is deterministic Hebrew
      # that runs before and after the model, and it is meant to be testable
      # without booting anything - so this job is also what proves it still
      # is. PyYAML is here only so the quality-scale file is parsed rather
      # than skipped.
      - run: pip install pytest pyyaml
      - run: python -m pytest tests -q --ignore=tests/ha

  tests:
    name: tests and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.8 source uses PEP 696 defaults on generic
          # classes, which no earlier interpreter can parse.
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - name: Tests, with coverage
        run: python -m pytest tests -q --cov
      - name: mypy --strict
        run: mypy custom_components/needle_assist/
